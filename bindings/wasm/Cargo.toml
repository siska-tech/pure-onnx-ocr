[package]
name = "pure-onnx-ocr-wasm"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
description = "WebAssembly (wasm-bindgen) bindings for pure-onnx-ocr: PaddleOCR PP-OCRv5 / PP-OCRv6 in the browser."
license = "Apache-2.0"
repository = "https://github.com/siska-tech/pure-onnx-ocr"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pure-onnx-ocr = { path = "../.." }
wasm-bindgen = "0.2"
js-sys = "0.3"
