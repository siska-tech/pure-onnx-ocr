[package]
name = "pure-onnx-ocr"
version = "0.1.0"
rust-version = "1.70"
edition = "2021"
description = "Pure Rust OCR pipeline that runs PaddleOCR DBNet + SVTR ONNX models without C/C++ dependencies."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/siska-tech/pure-onnx-ocr"
homepage = "https://github.com/siska-tech/pure-onnx-ocr"
documentation = "https://docs.rs/pure_onnx_ocr"
keywords = ["ocr", "onnx", "paddleocr", "text-detection", "text-recognition"]
categories = ["science::ai-and-machine-learning", "science::computer-vision"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tract-onnx = "0.20"
ndarray = "0.15"
time = "0.3.44"
i_overlay = "4.1.1"
geo-types = "=0.7.12"
image = "0.25"
imageproc = "0.25.0"
wonnx = { version = "0.5.1", optional = true }
pollster = { version = "0.3", optional = true }
wgpu = { version = "0.16", optional = true }

[features]
default = []
gpu = ["wonnx", "pollster", "wgpu"]
wasm = ["wasm-bindgen", "console_error_panic_hook", "serde", "serde-wasm-bindgen", "js-sys"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde-wasm-bindgen]
version = "0.6"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dev-dependencies]
once_cell = "1.21"
